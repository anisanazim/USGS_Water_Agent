[project]
name = "ichatbio-usgs-water-agent"
version = "0.1.0"
description = "USGS Water Data agent with latest-continuous enrichment support"
requires-python = ">=3.12"
dependencies = [
    "ichatbio-sdk==0.2.8",
    "pydantic>=2.12.5",
    "requests>=2.32.0",
    "pytest>=8.3.5",
    "pytest-asyncio~=1.3.0",
    "httpx>=0.28.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "allure-pytest>=2.16.0",
    "deepeval>=4.3.0",
    "langsmith>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "smoke: Live upstream USGS API smoke tests (nightly only, excluded from PR builds)",
]
