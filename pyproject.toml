[project]
name = "ichatbio-usgs-water-agent"
version = "0.1.0"
description = "USGS Water Data agent with latest-continuous enrichment support"
requires-python = ">=3.12"
dependencies = [
    "ichatbio-sdk==0.2.8",
    "pydantic>=2.12.5",
    "requests>=2.32.0",
    "pytest>=8.3.5",
    "pytest-asyncio~=1.3.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
